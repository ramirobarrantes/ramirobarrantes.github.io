<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Project hero placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4c1d95"/>
      <stop offset="55%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.7">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#glow)"/>
  <!-- workflow / network motif on the right side -->
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="2" fill="none">
    <line x1="980"  y1="160" x2="1140" y2="120"/>
    <line x1="980"  y1="160" x2="1140" y2="240"/>
    <line x1="1140" y1="120" x2="1300" y2="180"/>
    <line x1="1140" y1="240" x2="1300" y2="180"/>
    <line x1="1140" y1="240" x2="1300" y2="340"/>
    <line x1="1300" y1="180" x2="1460" y2="240"/>
    <line x1="1300" y1="340" x2="1460" y2="240"/>
    <line x1="1300" y1="340" x2="1460" y2="380"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="980"  cy="160" r="10"/>
    <circle cx="1140" cy="120" r="10"/>
    <circle cx="1140" cy="240" r="10"/>
    <circle cx="1300" cy="180" r="10"/>
    <circle cx="1300" cy="340" r="10"/>
    <circle cx="1460" cy="240" r="10"/>
    <circle cx="1460" cy="380" r="10"/>
  </g>
  <!-- scattered dots -->
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="120"  cy="80"  r="3"/>
    <circle cx="240"  cy="380" r="3"/>
    <circle cx="360"  cy="140" r="3"/>
    <circle cx="480"  cy="420" r="3"/>
    <circle cx="600"  cy="60"  r="3"/>
    <circle cx="720"  cy="320" r="3"/>
    <circle cx="180"  cy="260" r="3"/>
    <circle cx="540"  cy="220" r="3"/>
    <circle cx="800"  cy="440" r="3"/>
    <circle cx="60"   cy="200" r="3"/>
  </g>
</svg>
