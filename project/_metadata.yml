# Freeze computed outputs
execute: 
  freeze: true

# Disable default banner — projects use a custom hero (see template-partials below)
title-block-banner: false

# Project pages are kept simple — no citation block
citation: false

# Default for table of contents
toc: true
toc-title: Table of contents
toc-location: right

# Default hero image (overridden by per-project image:)
image: /assets/ramiro/img/project-placeholder.svg

# Wrap overflow code; use project-hero title block; include hero stylesheet
format:
  html:
    code-overflow: wrap
    template-partials:
      - ../_partials/project-hero/title-block.html
    include-in-header:
      - text: |
          <link rel="stylesheet" href="../../assets/project.css">

resources:
  - "../../assets/project.css"

# Post info
author: Ramiro Barrantes-Reynolds

# Project pages are kept simple — no comments section
comments: false
