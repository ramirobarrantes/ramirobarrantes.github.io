project:
  type: website
  pre-render:
    - "_scripts/fetch-gitlab-heatmap.sh"
  # post-render:
  #   - "cp -rnv static/. _site" # source: https://github.com/quarto-dev/quarto-cli/discussions/4162#discussioncomment-4831352

website:
  title: "Ramiro Barrantes-Reynolds"
  site-url: https://ramirobarrantes.com
  description: "Bioinformatics scientist and data scientist specializing in genomics, epigenomics, and Bayesian statistics."
  favicon: assets/ramiro/img/logo_rounded.svg
  page-navigation: true
  back-to-top-navigation: true
  twitter-card:
    creator: "@ramirobarrantes"
    site: "@ramirobarrantes"
    card-style: summary_large_image
  comments:
    utterances:
      repo: ramirobarrantes/website
      label: utterances
      theme: body-light
      issue-term: title
  # search:
  #   algolia:
  #     index-name: silviacanelon_com_2nwwu5566h_pages
  #     application-id: 2NWWU5566H
  #     search-only-api-key: 4fc205c04b677b0951348a8571b2d7d0
  #     show-logo: false
      # index-fields:
      #   href: url
      #   title: title
      #   section: subtitle
      #   text: body
 
  navbar:
    logo: assets/ramiro/img/logo_rounded.svg
    # logo: assets/ramiro/img/logo_noBg.svg
    tools:
    - icon: github
      href: https://www.github.com/ramirobarrantes
    right:
      - text: About
        aria-label: "About Me"
        href: about/index.qmd
      - text: Projects
        aria-label: "Project Portfolio"
        href: project/index.qmd
      - text: Blog
        aria-label: "Meeting People Where They R"
        href: blog/index.qmd
      - text: Publications
        aria-label: "Publications"
        href: publication/index.qmd

  
  page-footer:
    left: >-
     &#169; 2026 Ramiro Barrantes-Reynolds &#8729; Made with [Quarto](https://quarto.org)
    center: |
      <a class="link-dark me-1" href="/accessibility.html" title="Accessibility commitment" target="_blank" rel="noopener">{{< fa universal-access >}}</a>
      <a class="link-dark me-1" href="https://linkedin.com/in/ramirobarrantes" title="LinkedIn" target="_blank" rel="noopener">{{< fa brands linkedin >}}</a>
      <a class="link-dark me-1" href="https://github.com/ramirobarrantes" title="github" target="_blank" rel="noopener">{{< fa brands github >}}</a>
      <a class="link-dark me-1" href="https://orcid.org/" title="ORCID" target="_blank" rel="noopener">{{< ai orcid >}}</a>
      <a class="link-dark me-1" href="https://scholar.google.com/" title="Google Scholar" target="_blank"rel="noopener">{{< ai google-scholar >}}</a>

    right: 
      - text: "Accessibility"
        aria-label: "Accessibility Commitment"
        href: accessibility.qmd
      - text: "Contact"
        aria-label: "Contact Form"
        href: "contact.qmd"
      - text: "License"
        aria-label: "License Details"
        href: license.qmd
      - icon: rss
        href: blog/index.xml

format:
  html:
    theme:
      light:
        - cosmo
        - assets/ramiro-theme-light.scss
      dark:
        - cosmo
        - assets/ramiro-theme-dark.scss
    highlight-style: a11y
    code-link: true
    pagetitle: "{{< meta title >}}"
    lightbox: true

execute: 
  freeze: auto

include-in-header:
  - assets/ramiro/umami.html
  - assets/ramiro/google-search-console.html
